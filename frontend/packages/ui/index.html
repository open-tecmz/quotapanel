<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>QuotaPanel</title>
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <style>
        html,
        body {
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        @media (prefers-color-scheme: dark) {
            html,
            body {
                background-color: #0f172a;
            }
        }

        /* ── 启动加载屏 ── */
        #app-loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background-color: #f8fafc;
            z-index: 9999;
            transition: opacity 0.25s ease;
        }

        @media (prefers-color-scheme: dark) {
            #app-loading {
                background-color: #0f172a;
            }
        }

        #app-loading .loading-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #018b8d 0%, #037172 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(1, 139, 141, 0.35);
            animation: loading-pulse 1.6s ease-in-out infinite;
        }

        #app-loading .loading-logo svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #app-loading .loading-title {
            font-family: Inter, system-ui, -apple-system, sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #018b8d;
        }

        #app-loading .loading-dots {
            display: flex;
            gap: 6px;
        }

        #app-loading .loading-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #018b8d;
            opacity: 0.3;
            animation: loading-dot 1.2s ease-in-out infinite;
        }

        #app-loading .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        #app-loading .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes loading-pulse {
            0%, 100% { transform: scale(1);   box-shadow: 0 4px 20px rgba(1,139,141,0.35); }
            50%       { transform: scale(1.06); box-shadow: 0 6px 28px rgba(1,139,141,0.5);  }
        }

        @keyframes loading-dot {
            0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
            40%            { opacity: 1;   transform: scale(1.4); }
        }
    </style>
</head>

<body spellcheck="false">
    <div id="app">
        <!-- 启动加载屏：Vue 挂载后会自动替换此内容 -->
        <div id="app-loading" aria-label="正在加载" role="status">
            <div class="loading-logo">
                <!-- QuotaPanel 品牌图标（闪电/星形简化版） -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M13 2L4.5 13.5H11L10 22L20 10H13.5L13 2Z"/>
                </svg>
            </div>
            <div class="loading-title">QuotaPanel</div>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
    <script src="./src/main.ts" type="module"></script>
</body>

</html>
