<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">QuotaPanel: 17 AI subscription quotas in one desktop panel</title>
  <desc id="heroDesc">Left: the project name and a one-line description. Right: a quota card showing the 5-hour, weekly and monthly windows with percentage used, reset time and status color.</desc>

  <!-- surface: light rounded card; nothing is drawn outside it -->
  <rect width="1200" height="420" rx="26" fill="#EDF1F7"/>

  <!-- title block -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif">
    <text x="56" y="96" font-size="19" letter-spacing="0.6" fill="#5A6B7F">AI SUBSCRIPTION QUOTAS · DESKTOP</text>

    <text x="55" y="176" font-size="68" font-weight="700" letter-spacing="-1.4" fill="#0F172A">QuotaPanel</text>

    <text x="56" y="226" font-size="23" fill="#3A4A5F">Claude, ChatGPT, Cursor, Copilot, GLM, Kimi…</text>
    <text x="56" y="260" font-size="23" fill="#3A4A5F">17 subscriptions and API balances in one panel.</text>

    <line x1="56" y1="304" x2="600" y2="304" stroke="#D6DFEA" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5A6B7F">
      <text x="56" y="344">macOS · Windows · Linux</text>
      <text x="330" y="344">Apache-2.0</text>
      <text x="452" y="344">Local data</text>
    </g>
  </g>

  <!-- proof: a quota card redrawn from the real interface -->
  <g id="quota-card" transform="translate(632 52)">
    <rect x="0" y="0" width="512" height="316" rx="18" fill="#FFFFFF" stroke="#D6DFEA"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif">
      <text x="26" y="50" font-size="22" font-weight="600" fill="#0F172A">Claude Pro</text>
      <text x="26" y="74" font-size="15" fill="#5A6B7F">Anthropic · browser login</text>

      <!-- status badge -->
      <rect x="370" y="28" width="116" height="30" rx="15" fill="#FDF4E3" stroke="#EFD7AB"/>
      <text x="428" y="48" font-size="15" fill="#A65A06" text-anchor="middle">Nearly used</text>

      <line x1="26" y1="94" x2="486" y2="94" stroke="#E4EAF2" stroke-width="1"/>

      <!-- quota window rows -->
      <g font-size="19" fill="#25344A">
        <text x="26" y="137">5-hour</text>
        <text x="26" y="195">Weekly</text>
        <text x="26" y="253">Monthly</text>
      </g>

      <!-- tracks -->
      <g>
        <rect x="196" y="126" width="152" height="9" rx="4.5" fill="#E3E9F1"/>
        <rect x="196" y="126" width="18" height="9" rx="4.5" fill="#018B8D"/>

        <rect x="196" y="184" width="152" height="9" rx="4.5" fill="#E3E9F1"/>
        <rect x="196" y="184" width="116" height="9" rx="4.5" fill="#D97706"/>

        <rect x="196" y="242" width="152" height="9" rx="4.5" fill="#E3E9F1"/>
        <rect x="196" y="242" width="125" height="9" rx="4.5" fill="#D97706"/>
      </g>

      <!-- percentages and reset times -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#25344A">
        <text x="362" y="137">12%</text>
        <text x="362" y="195">76%</text>
        <text x="362" y="253">82%</text>
      </g>
      <g font-size="15" fill="#5A6B7F">
        <text x="486" y="137" text-anchor="end">today 14:20</text>
        <text x="486" y="195" text-anchor="end">Wed 09:00</text>
        <text x="486" y="253" text-anchor="end">10-01 00:00</text>
      </g>

      <line x1="26" y1="276" x2="486" y2="276" stroke="#E4EAF2" stroke-width="1"/>
      <text x="26" y="300" font-size="15" fill="#5A6B7F">Refreshed 5 minutes ago</text>
    </g>
  </g>
</svg>
